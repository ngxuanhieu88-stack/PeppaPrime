<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0f">
<title>AimLock Peppa | Control Panel</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#14141c;--panel2:#1b1b25;--line:#2c2c38;--red:#ff354d;--muted:#9999aa;--white:#f6f6fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#47121d 0,transparent 42%),var(--bg);color:var(--white);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:auto;padding:28px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#ff5365,#8b1025);display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 8px 30px #ff354d30}
h1{font-size:clamp(22px,5vw,30px);letter-spacing:1px;margin:0}.sub{color:var(--muted);font-size:12px}.tag{border:1px solid #69303a;background:#32151d;color:#ff9aa5;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.8px}
.hero,.section{background:linear-gradient(145deg,#171720,#111118);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 14px 40px #0004}
.hero h2{margin:0 0 5px;font-size:18px}.hero p,.note{margin:0;color:var(--muted);font-size:13px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section h3{font-size:14px;letter-spacing:1px;margin:0;color:#d8d8e2}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feature{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:68px}
.feature span{font-weight:650;font-size:14px}.switch{position:relative;width:48px;height:27px;flex:none}.switch input{opacity:0;width:0;height:0}.track{position:absolute;inset:0;border-radius:99px;background:#454552;transition:.2s;cursor:pointer}.track:before{content:"";position:absolute;width:19px;height:19px;left:4px;top:4px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.track{background:var(--red)}.switch input:checked+.track:before{transform:translateX(21px)}
.dpi-value{font-size:42px;font-weight:850;letter-spacing:-1px;color:#fff}.dpi-value small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}
input[type=range]{width:100%;accent-color:var(--red);margin:18px 0 7px;cursor:pointer}.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.controls{display:flex;gap:9px;margin-top:16px}.btn{border:1px solid var(--line);background:#242430;color:white;padding:10px 14px;border-radius:11px;font-weight:700;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:white}.btn:active{transform:scale(.98)}
.status{margin-top:12px;color:var(--muted);font-size:12px}.footer{text-align:center;color:#777787;font-size:11px;padding:8px 10px}
@media(max-width:480px){.wrap{padding:20px 12px 36px}.hero,.section{padding:16px}.grid{grid-template-columns:1fr}.feature{min-height:62px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">P</div><div><h1>AIMLOCK PEPPA</h1><div class="sub">CONTROL PANEL</div></div></div>
    <span class="tag">WEB UI</span>
  </header>
  <section class="hero">
    <h2>Xin chào!</h2>
    <p>Bảng điều khiển với các công tắc và thanh điều chỉnh giá trị DPI.</p>
  </section>
  <section class="section">
    <div class="section-head"><h3>CHỨC NĂNG</h3><span class="sub" id="count">0/8 đang bật</span></div>
    <div class="grid" id="features"></div>
  </section>
  <section class="section">
    <div class="section-head"><h3>ĐIỀU CHỈNH DPI</h3><span class="tag">0 — 300</span></div>
    <div class="dpi-value"><span id="dpiValue">150</span> <small>DPI</small></div>
    <input id="dpi" type="range" min="0" max="300" step="1" value="150" aria-label="Thanh chỉnh DPI">
    <div class="range-labels"><span>0</span><span>150</span><span>300</span></div>
    <div class="controls"><button class="btn" id="minus">− 10</button><button class="btn" id="plus">+ 10</button><button class="btn" id="reset">Đặt lại</button><button class="btn primary" id="apply">Áp dụng</button></div>
    <div class="status" id="status" aria-live="polite">Giá trị hiển thị: 150</div>
  </section>
</main>
<script>
const names=["Tối ưu","Nhẹ tâm","Hút tâm","Bám đầu","Đầm tâm","Buff Màn","AimLock","Aimbot"];
const root=document.getElementById("features");
names.forEach((name,i)=>{
 const label=document.createElement("label");label.className="feature";
 const text=document.createElement("span");text.textContent=name;
 const sw=document.createElement("span");sw.className="switch";
 const input=document.createElement("input");input.type="checkbox";input.setAttribute("aria-label",name);
 const track=document.createElement("span");track.className="track";
 input.addEventListener("change",updateCount);
 sw.append(input,track);label.append(text,sw);root.append(label);
});
function updateCount(){const n=root.querySelectorAll("input:checked").length;document.getElementById("count").textContent=n+"/8 đang bật"}
const dpi=document.getElementById("dpi"),value=document.getElementById("dpiValue"),status=document.getElementById("status");
function setDpi(v){dpi.value=Math.max(0,Math.min(300,Number(v)));value.textContent=dpi.value;status.textContent="Giá trị hiển thị: "+dpi.value}
dpi.addEventListener("input",()=>setDpi(dpi.value));
document.getElementById("minus").onclick=()=>setDpi(+dpi.value-10);
document.getElementById("plus").onclick=()=>setDpi(+dpi.value+10);
document.getElementById("reset").onclick=()=>setDpi(150);
document.getElementById("apply").onclick=()=>{status.textContent="Đã áp dụng";};
</script>
</body>
</html>
